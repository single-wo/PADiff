model:
  use_pharmacophore: true
  node_dim: 256
  edge_dim: 64
  center_pos_mode: protein
  knn: 32
  cutoff_mode: knn
  denoiser:
    backbone: EGNN
    num_blocks: 9
    cutoff: 15
    use_gate: true
  diff:
    num_timesteps: 1000
    time_dim: 10
    categorical_space: discrete
    diff_pos:
      beta_schedule: advance
      scale_start: 0.9999
      scale_end: 0.0001
      width: 3
    diff_atom:
      init_prob: tomask
      beta_schedule: advance
      scale_start: 0.9999
      scale_end: 0.0001
      width: 3
    diff_phore:
      init_prob: uniform
      beta_schedule: advance
      scale_start: 0.9999
      scale_end: 0.0001
      width: 3
    diff_bond:
      init_prob: absorb
      beta_schedule: segment
      time_segment: [600, 400]
      segment_diff:
        - scale_start: 0.9999
          scale_end: 0.001
          width: 3
        - scale_start: 0.001
          scale_end: 0.0001
          width: 2
  condition_on_pocket_only: true

train:
  seed: 2023
  batch_size: 32
  num_workers: 4
  pin_memory: true
  max_iters: 300000
  val_freq: 1000
  val_num_timesteps: 10
  train_report_iter: 1000
  pos_noise_std: 0.05
  phore_pos_noise_std: 0.05
  cardinality_prior_cache: data/crossdocked_cardinality_prior.pkl
  max_grad_norm: 50.0
  use_amp: true
  amp_dtype: bfloat16
  optimizer:
    type: adamw
    lr: 0.0001
    weight_decay: 0.0001
    beta1: 0.99
    beta2: 0.999
  scheduler:
    type: plateau
    factor: 0.9
    patience: 10
    min_lr: 0.000001

data:
  name: protein_ligand
  path: data/crossdocked_v1.1_rmsd1.0_pocket10_processed.lmdb
  split: data/crossdocked_pocket10_pose_split.pt
  transform:
    ligand_atom_mode: aromatic
    random_rot: false
    sample: false
